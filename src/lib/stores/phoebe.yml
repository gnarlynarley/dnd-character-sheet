features:
  feats: >
    # Lucky


    **Luck Points**. You have a number of Luck Points equal to your Proficiency
    Bonus and can spend the points on the benefits below. You regain your
    expended Luck Points when you finish a Long Rest.


    **Advantage**. When you roll a d20 for a D20 Test, you can spend 1 Luck
    Point to give yourself Advantage on the roll.


    **Disadvantage**. When a creature rolls a d20 for an attack roll against
    you, you can spend 1 Luck Point to impose Disadvantage on that roll.
  species: >
    # Flight

    Your wings give you a flying speed equal to your walking speed (30 feet). To
    use this speed, you can't be wearing medium or heavy armor.


    # Talons

    Your talons are natural weapons, which you can use to make unarmed strikes.
    If you hit with them, you deal slashing damage equal to **1d6** + your
    Strength modifier, instead of the bludgeoning damage normal for an unarmed
    strike.


    # Wind Caller

    Starting at 3rd level, you can cast the *Gust of Wind* spell with this
    trait, without requiring a material component. Once you cast the spell with
    this trait, you can't do so again until you finish a Long Rest. You can also
    cast the spell using any spell slots you have of 2nd level or higher.
    Intelligence is your spellcasting ability for this trait.
  class: >
    ## Level 1: Spellcasting

    You have learned to cast spells through dedicated study, recorded in your
    spellbook.


    ## Level 1: Ritual Adept

    If a spell has the Ritual tag and is in your spellbook, you can cast it as a
    Ritual without needing to have it prepared.


    ## Level 1: Arcane Recovery

    Once per day when you finish a Short Rest, you can choose expended spell
    slots to recover. The spell slots can have a combined level equal to or less
    than half your Wizard level (round up), and none can be 6th level or higher.


    ## Level 2: Scholar

    You have Expertise in one skill you're proficient in from the following
    list: Arcana, History, Investigation, Medicine, Nature, or Religion. Chosen:
    **Arcana**.


    # Diviner


    ## Level 3: Divination Savant

    The gold and time you must spend to copy a Divination spell into your
    spellbook is halved, and you add two free Divination spells to your
    spellbook whenever you gain a level in this class.


    ## Level 3: Portent

    Your study of divination magic gives you the ability to peer briefly into
    the future. At the end of a Long Rest, roll two d20s and record the numbers.
    You can replace any attack roll, saving throw, or ability check made by you
    or a creature you can see with one of these rolls, deciding to do so before
    or after the original roll, but before any effects of the roll occur. Once
    you use a Portent roll, you can't use it again until you finish a Long Rest.
